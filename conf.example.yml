# ============================================================================
# House Research — пример conf/conf.yml
#
# Этот файл управляет поведением приложения (в отличие от .env, где лежат
# токены/ключи). Если файла conf/conf.yml нет — приложение создаст его само
# со значениями по умолчанию при первом запуске. Но проще сразу подготовить
# свой:
#
#   mkdir -p conf
#   cp conf.example.yml conf/conf.yml
#
# и поправить под себя.
# ============================================================================

# Точки, от которых считается маршрут/время в пути до объявления
# (например, офис, дом родителей, храм и т.д.). Можно добавить сколько угодно.
importantLocations:
  - name: "Офис"
    lat: "55.751017"
    lon: "37.617261"
  - name: "Храм"
    lat: "55.744635"
    lon: "37.605634"

# Параметры поиска на Циан (используются в src/crons/cian-search.ts).
cianSearch:
  # Диапазон цены в рублях
  maxPrice: 50000
  minPrice: 0
  # ID районов Циан (geo-фильтр). Узнать можно, открыв поиск на cian.ru
  # с нужными фильтрами и посмотрев тело запроса к
  # api.cian.ru/lk-specialist/v1/search-offers/ в devtools (вкладка Network) —
  # там будет geo.value[].id для каждого выбранного района.
  geo:
    - 0
    - 1
    - 2
  # ID регионов Циан (1 — Москва, 4593 — Московская область и т.д.)
  regions:
    - 1

# Путь внутри контейнера/файловой системы, куда Avito Parser складывает
# HTML-файлы объявлений (export/*.html). Должен совпадать с volume,
# смонтированным в docker-compose (см. docker-compose.example.yml:
# ./avito-export:/avito-export).
avitoDiskPath: "/avito-export"

# Уровень логирования: trace | debug | info | warn | error
logLevel: "info"
